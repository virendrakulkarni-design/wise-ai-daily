<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Daily — Video Summarizer & AI News</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI Daily" />
  <meta name="theme-color" content="#6c3fc5" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="styles.css?v=2.2" />
</head>
<body>
  <div id="app"></div>
  <script>
    // Read ?share=URL from query string (set by iOS Shortcut or share.html)
    (function() {
      const params = new URLSearchParams(location.search);
      const shared = params.get('share') || params.get('url') || '';
      if (shared) {
        sessionStorage.setItem('pending-share', decodeURIComponent(shared));
        // Clean URL without reloading
        history.replaceState({}, '', location.pathname);
      }
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/wise-ai-daily/sw.js?v=2.2', { scope: '/wise-ai-daily/' })
        .then(reg => {
          reg.update();
        })
        .catch(() => {});
    }
  </script>
  <script src="app.js?v=2.2"></script>
</body>
</html>
