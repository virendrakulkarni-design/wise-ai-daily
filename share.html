<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AI Daily</title>
  <script>
    const p = new URLSearchParams(location.search);
    const u = p.get('url') || p.get('text')?.match(/https?:\/\/[^\s]+/)?.[0] || p.get('share') || '';
    if (u) sessionStorage.setItem('pending-share', u);
    location.replace('/wise-ai-daily/' + (u ? '?share=' + encodeURIComponent(u) : ''));
  </script>
</head>
<body></body>
</html>
