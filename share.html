<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AI Daily — Shared</title>
  <meta http-equiv="refresh" content="0;url=/wise-ai-daily/">
  <script>
    // Grab the shared URL from query params and pass via sessionStorage
    const p = new URLSearchParams(location.search);
    const shared = p.get('url') || p.get('text')?.match(/https?:\/\/[^\s]+/)?.[0] || '';
    if (shared) sessionStorage.setItem('pending-share', shared);
    location.replace('/wise-ai-daily/');
  </script>
</head>
<body></body>
</html>
